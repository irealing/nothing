[workspace]
resolver = "2"
members = ["crates/nothing-core", "src-tauri"]

[workspace.package]
version = "0.1.12"
edition = "2021"
license = "MIT"
authors = ["nothing contributors"]

[workspace.dependencies]
rusqlite = { version = "0.37", features = ["bundled-sqlcipher-vendored-openssl", "column_decltype"] }
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ulid = { version = "1", features = ["serde"] }
chrono = { version = "0.4", features = ["serde"] }
tempfile = "3"
base64 = "0.22"
csv = "1.3"
encoding_rs = "0.8"
